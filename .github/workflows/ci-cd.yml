name: OmniQuery CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gateway/package-lock.json

      - name: Install Gateway Dependencies
        run: npm install

      - name: Smoke Test Gateway Startup
        run: node --check src/server.js

  test-ai-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-worker
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AI Worker Dependencies
        run: pip install -r requirements.txt

      - name: Smoke Test FastAPI Import
        run: python -c "from app.main import app; print('ok')"

  trigger-deployments:
    needs: [test-gateway, test-ai-worker]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Output Success
        run: echo "Code checks passed. Connected free-tier platforms can auto-deploy now."
